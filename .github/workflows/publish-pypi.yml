name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    # skip the project's default-groups (research needs R on PATH for rpy2)
    env:
      UV_SYNC_FLAGS: --no-default-groups --group dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      # a release whose tag names another version stops here, before PyPI gets a mislabeled build
      - name: Check the tag names the package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(uv version --short)"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::the tag $TAG does not name the package version $expected"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Sync environment
        run: uv sync $UV_SYNC_FLAGS

      - name: Build release artifacts
        run: uv build

      - name: Check release artifacts
        run: uv run $UV_SYNC_FLAGS pytest tests/packaging/test_release_artifacts.py

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
