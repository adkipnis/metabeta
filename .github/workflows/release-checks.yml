name: Release checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  package:
    runs-on: ubuntu-latest

    # the project's default-groups pull in the research extra (rpy2 needs R in PATH,
    # pymc/scamd are heavy); release checks only need the core package + dev tooling,
    # so every uv call here opts out of the defaults explicitly
    env:
      UV_SYNC_FLAGS: --no-default-groups --group dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync environment
        run: uv sync $UV_SYNC_FLAGS

      - name: Check formatting
        run: uv run $UV_SYNC_FLAGS blue --check --diff metabeta tests

      - name: Run tests
        run: uv run $UV_SYNC_FLAGS pytest tests/models tests/evaluation tests/utils

      - name: Build release artifacts
        run: uv build

      - name: Check release artifacts
        run: uv run $UV_SYNC_FLAGS pytest tests/packaging/test_release_artifacts.py
